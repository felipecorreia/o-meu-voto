name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest

  web-next:
    name: Comparison page type check, build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-next
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-next/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Test the page's utilities
        run: npm test
      # What `wrangler pages deploy dist` publishes next to functions/ (web-next/README.md, "Deploy and the Pages edge").
      - name: Check the Pages files are in the build
        run: test -f dist/index.html && test -f dist/_routes.json && test -f dist/404.html
