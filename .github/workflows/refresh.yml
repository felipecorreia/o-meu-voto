# The refresh pipeline of docs/codebase-design.md, section 5: fetch -> extract -> build ->
# validate -> publish, on the cadences the TSE declares for its datasets (docs/domain-model.md,
# section 2), started by Cloud Scheduler or by hand. It runs here, never inside Cloud Run.
# Index stages stop at the first failure; the bounded photo stages may fail independently.
# A bad index is never published, and every raw
# ZIP and CSV lives in a temporary directory that the last step removes even on failure
# (ADR 0004). Only index.duckdb and manifest.json leave the runner, through the publish stage.
#
# Google Cloud access is keyless, through Workload Identity Federation: each run exchanges its
# GitHub OIDC token for a short-lived token of the publisher service account, and the provider
# accepts only this repository's main branch (set up by the private operations runbook). Configuration
# the captain sets (see docs/pipeline.md, "Publishing the index"):
#   INDEX_BUCKET                    secret: name of the GCS bucket that holds the index
#   GCP_WORKLOAD_IDENTITY_PROVIDER  variable: full resource name of the WIF provider,
#                                   projects/<number>/locations/global/workloadIdentityPools/...
#   GCP_PUBLISHER_SA                variable: email of the service account that can write that bucket
# Optional repository variable:
#   INDEX_BUCKET_PREFIX             object name prefix inside the bucket (default: none)
#
# Secrets for the photo steps (see docs/pipeline.md, "Mirroring candidate photos to R2"), all optional:
# until the captain provisions them, the download of the photo ZIPs and the mirror-photos step
# log why and skip, and the rest of the refresh runs as before. Once they are set, the photo
# ZIPs are downloaded before build. Photo failure leaves the validated index publishable.
#   R2_ENDPOINT             R2 account S3 endpoint URL
#   R2_BUCKET               R2 bucket name
#   R2_ACCESS_KEY_ID        R2 access key id
#   R2_SECRET_ACCESS_KEY    R2 secret access key
#   R2_PUBLIC_DOMAIN        public base URL the mirrored photos are served from
# Optional repository variable for the photo cleanup after publish (ADR 0015):
#   PHOTO_CLEANUP_MODE      "delete" removes R2 photos past the grace; anything else, or unset,
#                           is a dry run that reports them and deletes nothing
name: Refresh index

on:
  # Started at the TSE-aligned times by Cloud Scheduler through the workflow_dispatch API
  # (Cloud Scheduler -> Workflows refresh-dispatch -> this workflow on main), not by a
  # schedule: GitHub cron fired hours late or skipped runs (ops/README.md, section 6,
  # which also says why no cron is kept as a fallback). The times, America/Sao_Paulo, each
  # about forty minutes after the declared publication so the CDN has the new file:
  #   07:05  polling places, published daily at 06:25
  #   09:10, 13:10, 17:10, 20:10  candidates, published at 08:30, 12:30, 16:30 and 19:30
  # Off-season, when polling places come from the monthly ATUAL file instead of the election
  # file, is not wired here: the ATUAL ZIP is deliberately absent from the fetch registry
  # (pipeline/datasets.py) during the election year.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the GitHub OIDC token that Workload Identity Federation exchanges

# One refresh at a time: two runs publishing concurrently could interleave their writes.
concurrency:
  group: refresh-index
  cancel-in-progress: false

jobs:
  refresh:
    name: Fetch, build, validate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      INDEX_BUCKET: ${{ secrets.INDEX_BUCKET }}
      INDEX_BUCKET_PREFIX: ${{ vars.INDEX_BUCKET_PREFIX }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_PUBLISHER_SA: ${{ vars.GCP_PUBLISHER_SA }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install the pipeline dependency group
        run: uv sync --locked --group pipeline

      - name: Check the bucket configuration
        run: |
          missing=0
          if [ -z "$INDEX_BUCKET" ]; then
            echo "::error::the INDEX_BUCKET secret is not set; see docs/pipeline.md, 'Publishing the index'"
            missing=1
          fi
          for var in GCP_WORKLOAD_IDENTITY_PROVIDER GCP_PUBLISHER_SA; do
            if [ -z "${!var}" ]; then
              echo "::error::the $var repository variable is not set; see docs/pipeline.md, 'Publishing the index'"
              missing=1
            fi
          done
          exit "$missing"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PUBLISHER_SA }}

      - name: Create the temporary work directory
        # Under RUNNER_TEMP, removed by the last step: raw ZIPs and CSVs never leave it.
        run: |
          WORK="$(mktemp -d "$RUNNER_TEMP/refresh.XXXXXX")"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          mkdir -p "$WORK/zips" "$WORK/csv" "$WORK/index" "$WORK/previous" "$WORK/photos"

      - name: Decide whether to mirror candidate photos
        # All five R2 secrets or none: the photo ZIPs (~125 MB) are only worth downloading
        # when the mirror-photos step can use them.
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
        run: |
          if [ -z "$R2_ENDPOINT" ] || [ -z "$R2_BUCKET" ] || [ -z "$R2_ACCESS_KEY_ID" ] ||
             [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_PUBLIC_DOMAIN" ]; then
            echo "mirror-photos: R2 secrets not set yet, photos are neither downloaded nor mirrored (see docs/pipeline.md, 'Mirroring candidate photos to R2')"
            echo "MIRROR_PHOTOS=false" >> "$GITHUB_ENV"
          elif timeout --signal=TERM --kill-after=30s 2m uv run python -m br_elections_mcp.pipeline photo-load-status \
            --r2-endpoint "$R2_ENDPOINT" \
            --r2-bucket "$R2_BUCKET" \
            --r2-access-key-id "$R2_ACCESS_KEY_ID" \
            --r2-secret-access-key "$R2_SECRET_ACCESS_KEY"; then
            echo "MIRROR_PHOTOS=true" >> "$GITHUB_ENV"
          else
            status=$?
            if [ "$status" -eq 3 ]; then
              echo "mirror-photos: first full photo load has not completed; publishing index without photos"
            else
              echo "::error::photo-load-status failed with exit code $status; publishing index without photos"
              echo "PHOTO_STATUS_FAILED=true" >> "$GITHUB_ENV"
            fi
            echo "MIRROR_PHOTOS=false" >> "$GITHUB_ENV"
          fi

      - name: Fetch the TSE ZIPs
        run: uv run python -m br_elections_mcp.pipeline fetch --output "$WORK/zips"

      - name: Fetch the candidate photo ZIPs
        id: fetch_photos
        continue-on-error: true
        if: env.MIRROR_PHOTOS == 'true'
        run: timeout --signal=TERM --kill-after=30s 5m uv run python -m br_elections_mcp.pipeline fetch --photos --output "$WORK/photos"

      - name: Extract the CSVs build reads
        run: |
          extract() {
            uv run python -m br_elections_mcp.pipeline extract --zip "$WORK/zips/$1" --output-dir "$WORK/csv"
          }
          {
            echo "POLLING_PLACES_CSV=$(extract eleitorado_local_votacao_2026.zip)"
            echo "MUNICIPALITIES_CSV=$(extract municipio_tse_ibge.zip)"
            echo "CANDIDATES_CSV=$(extract consulta_cand_2026.zip)"
            echo "CANDIDATES_COMPLEMENTARY_CSV=$(extract consulta_cand_complementar_2026.zip)"
            echo "SOCIAL_LINKS_CSV=$(extract rede_social_candidato_2026.zip)"
            echo "CANDIDATE_ASSETS_CSV=$(extract bem_candidato_2026.zip)"
          } >> "$GITHUB_ENV"

      - name: Build the index
        run: |
          uv run python -m br_elections_mcp.pipeline build \
            --polling-places "$POLLING_PLACES_CSV" \
            --municipalities "$MUNICIPALITIES_CSV" \
            --candidates "$CANDIDATES_CSV" \
            --candidates-complementary "$CANDIDATES_COMPLEMENTARY_CSV" \
            --social-links "$SOCIAL_LINKS_CSV" \
            --candidate-assets "$CANDIDATE_ASSETS_CSV" \
            --output-dir "$WORK/index"

      - name: Download the manifest currently published
        # The previous manifest feeds the count-stability gate of validate; the first run has none.
        run: |
          uv run python -m br_elections_mcp.pipeline current-manifest \
            --bucket "$INDEX_BUCKET" --prefix "$INDEX_BUCKET_PREFIX" \
            --output "$WORK/previous/manifest.json"

      - name: Validate the index
        run: |
          ARGS=()
          if [ -f "$WORK/previous/manifest.json" ]; then
            ARGS+=(--previous-manifest "$WORK/previous/manifest.json")
          fi
          if [ "$MIRROR_PHOTOS" = true ]; then
            ARGS+=(--photo-public-domain "")
          fi
          uv run python -m br_elections_mcp.pipeline validate \
            --polling-places "$POLLING_PLACES_CSV" \
            --municipalities "$MUNICIPALITIES_CSV" \
            --candidates "$CANDIDATES_CSV" \
            --candidates-complementary "$CANDIDATES_COMPLEMENTARY_CSV" \
            --social-links "$SOCIAL_LINKS_CSV" \
            --candidate-assets "$CANDIDATE_ASSETS_CSV" \
            --index-dir "$WORK/index" \
            --elections data/elections.yaml \
            --output-dir "$WORK/index" \
            "${ARGS[@]}"

      - name: Download the currently published index for photo carry-forward
        id: current_index
        if: env.MIRROR_PHOTOS == 'true' && steps.fetch_photos.outcome == 'success'
        continue-on-error: true
        run: |
          timeout --signal=TERM --kill-after=30s 5m uv run python -m br_elections_mcp.pipeline current-index \
            --bucket "$INDEX_BUCKET" --prefix "$INDEX_BUCKET_PREFIX" \
            --output-dir "$WORK/previous"

      - name: Retain verified published photo URLs
        id: retain_photos
        if: env.MIRROR_PHOTOS == 'true' && steps.fetch_photos.outcome == 'success' && steps.current_index.outcome == 'success'
        continue-on-error: true
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
        run: |
          mkdir -p "$WORK/retained"
          cp "$WORK/index/index.duckdb" "$WORK/index/manifest.json" "$WORK/retained/"
          timeout --signal=TERM --kill-after=30s 5m uv run python -m br_elections_mcp.pipeline retain-photos \
            --zips-dir "$WORK/photos" \
            --index-dir "$WORK/retained" \
            --previous-index-dir "$WORK/previous" \
            --public-domain "$R2_PUBLIC_DOMAIN" \
            --r2-endpoint "$R2_ENDPOINT" \
            --r2-bucket "$R2_BUCKET" \
            --r2-access-key-id "$R2_ACCESS_KEY_ID" \
            --r2-secret-access-key "$R2_SECRET_ACCESS_KEY"
          echo "PHOTO_INDEX_DIR=$WORK/retained" >> "$GITHUB_ENV"

      - name: Mirror candidate photos to R2
        id: mirror_photos
        if: env.MIRROR_PHOTOS == 'true' && steps.fetch_photos.outcome == 'success'
        continue-on-error: true
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
        run: |
          mkdir -p "$WORK/mirrored"
          cp "${PHOTO_INDEX_DIR:-$WORK/index}/index.duckdb" "${PHOTO_INDEX_DIR:-$WORK/index}/manifest.json" "$WORK/mirrored/"
          timeout --signal=TERM --kill-after=30s 15m uv run python -m br_elections_mcp.pipeline mirror-photos \
            --zips-dir "$WORK/photos" \
            --index-dir "$WORK/mirrored" \
            --public-domain "$R2_PUBLIC_DOMAIN" \
            --r2-endpoint "$R2_ENDPOINT" \
            --r2-bucket "$R2_BUCKET" \
            --r2-access-key-id "$R2_ACCESS_KEY_ID" \
            --r2-secret-access-key "$R2_SECRET_ACCESS_KEY" \
            --retain-old-photos
          echo "PHOTO_INDEX_DIR=$WORK/mirrored" >> "$GITHUB_ENV"

      - name: Verify the final photo chain
        env:
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
        run: |
          if [ "$MIRROR_PHOTOS" = true ]; then
            domain="$R2_PUBLIC_DOMAIN"
          else
            domain=""
          fi
          uv run python -m br_elections_mcp.pipeline verify-photos \
            --index-dir "${PHOTO_INDEX_DIR:-$WORK/index}" --public-domain "$domain"

      - name: Publish the index
        id: publish
        run: |
          uv run python -m br_elections_mcp.pipeline publish \
            --index-dir "${PHOTO_INDEX_DIR:-$WORK/index}" \
            --bucket "$INDEX_BUCKET" --prefix "$INDEX_BUCKET_PREFIX"

      - name: Clean up R2 photos no served index references
        # Only after a successful publish and only when every photo stage succeeded, so both
        # the pair just published and the pair it replaced were verified (ADR 0015).
        id: clean_photos
        if: env.MIRROR_PHOTOS == 'true' && env.PHOTO_STATUS_FAILED != 'true' && steps.fetch_photos.outcome == 'success' && steps.current_index.outcome == 'success' && steps.retain_photos.outcome == 'success' && steps.mirror_photos.outcome == 'success'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
          PHOTO_CLEANUP_MODE: ${{ vars.PHOTO_CLEANUP_MODE }}
        run: |
          set -o pipefail
          ARGS=()
          if [ "$PHOTO_CLEANUP_MODE" != delete ]; then
            ARGS+=(--dry-run)
          fi
          timeout --signal=TERM --kill-after=30s 15m uv run python -m br_elections_mcp.pipeline clean-photos \
            --index-dir "$PHOTO_INDEX_DIR" \
            --previous-index-dir "$WORK/previous" \
            --public-domain "$R2_PUBLIC_DOMAIN" \
            --r2-endpoint "$R2_ENDPOINT" \
            --r2-bucket "$R2_BUCKET" \
            --r2-access-key-id "$R2_ACCESS_KEY_ID" \
            --r2-secret-access-key "$R2_SECRET_ACCESS_KEY" \
            --bucket "$INDEX_BUCKET" --prefix "$INDEX_BUCKET_PREFIX" \
            "${ARGS[@]}" 2>&1 | tee "$WORK/clean-photos.log"

      - name: Report the run
        if: always()
        run: |
          {
            echo "## Refresh"
            echo
            if [ -f "$WORK/zips/fetch.json" ]; then
              echo "### Fetch"
              echo
              echo "| Dataset | Status | Last-Modified | Size (bytes) |"
              echo "|---|---|---|---|"
              jq -r '.datasets[] | "| \(.dataset) | \(.status // "-") | \(.last_modified // "-") | \(.size // "-") |"' "$WORK/zips/fetch.json"
              echo
            fi
            if [ -f "$WORK/photos/fetch.json" ]; then
              echo "### Photo ZIPs"
              echo
              jq -r '"- \(.datasets | map(select(.status == 200)) | length) of \(.datasets | length) answered 200, \(.datasets | map(.size // 0) | add) bytes"' "$WORK/photos/fetch.json"
              jq -r '.datasets[] | select(.status != 200) | "- not fetched: \(.dataset) (\(.status // .error))"' "$WORK/photos/fetch.json"
              echo
            fi
            echo "### Photo steps"
            echo
            echo "- Load status query failed: ${PHOTO_STATUS_FAILED:-false}"
            echo "- Fetch outcome: ${{ steps.fetch_photos.outcome }}"
            echo "- Previous index outcome: ${{ steps.current_index.outcome }}"
            echo "- Carry-forward outcome: ${{ steps.retain_photos.outcome }}"
            echo "- Mirror outcome: ${{ steps.mirror_photos.outcome }}"
            echo "- Cleanup outcome (${{ vars.PHOTO_CLEANUP_MODE == 'delete' && 'delete' || 'dry run' }}): ${{ steps.clean_photos.outcome }}"
            if [ -f "$WORK/clean-photos.log" ]; then
              echo
              echo '```'
              cat "$WORK/clean-photos.log"
              echo '```'
            fi
            echo
            published_index_dir="${PHOTO_INDEX_DIR:-$WORK/index}"
            if [ -f "$published_index_dir/manifest.json" ]; then
              echo "### Manifest"
              echo
              echo "| Dataset | File | Generated at |"
              echo "|---|---|---|"
              jq -r '.datasets | to_entries[] | "| \(.key) | \(.value.file) | \(.value.generated_at) |"' "$published_index_dir/manifest.json"
              echo
              echo "- Index built at: $(jq -r .index_built_at "$published_index_dir/manifest.json")"
              echo "- Election: $(jq -c '{election_year, election_dates}' "$published_index_dir/manifest.json")"
              echo "- Counts: $(jq -c .counts "$published_index_dir/manifest.json")"
              echo "- Index SHA-256: \`$(jq -r .index_sha256 "$published_index_dir/manifest.json")\`"
              echo "- Manifest SHA-256: \`$(sha256sum "$published_index_dir/manifest.json" | cut -d' ' -f1)\`"
              echo
            fi
            if [ -f "$WORK/index/validation_report.json" ]; then
              echo "### Validation"
              echo
              echo "| Gate | Status | Message |"
              echo "|---|---|---|"
              jq -r '.gates[] | "| \(.name) | \(.status) | \(.message) |"' "$WORK/index/validation_report.json"
              echo
            fi
            if [ -f "$published_index_dir/publish.json" ]; then
              echo "### Publish"
              echo
              echo "- Version: \`$(jq -r .index_version "$published_index_dir/publish.json")\`"
              echo "- Objects: $(jq -c .objects "$published_index_dir/publish.json")"
              echo "- Published at: $(jq -r .published_at "$published_index_dir/publish.json")"
            else
              echo "Nothing was published: a stage before publish failed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run after publication if a photo stage failed
        if: env.PHOTO_STATUS_FAILED == 'true' || steps.fetch_photos.outcome == 'failure' || steps.current_index.outcome == 'failure' || steps.retain_photos.outcome == 'failure' || steps.mirror_photos.outcome == 'failure'
        run: |
          echo "::error::A photo stage failed; the validated index was still published. Inspect the photo outcomes in the summary."
          exit 1

      - name: Remove the work directory
        if: always()
        run: rm -rf "$WORK"
