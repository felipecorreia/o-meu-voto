# Calendário eleitoral curado à mão, uma entrada por eleição no escopo do serviço.
# O TSE não publica o calendário nem o horário de votação em formato consumível
# por máquina; a fonte é a resolução indicada em `calendar_source`.
# Esquema: src/br_elections_mcp/elections.py, validado por tests/test_elections_yaml.py.
schema_version: 1
elections:
  - id: general-2026
    name: "Eleições Gerais 2026"
    year: 2026
    kind: geral
    rounds:
      - number: 1
        date: 2026-10-04
      - number: 2
        date: 2026-10-25
        note: "Somente onde houver segundo turno: presidente e governador quando nenhum candidato alcança maioria absoluta no primeiro turno."
    voting_hours:
      start: "08:00"
      end: "17:00"
      timezone: America/Sao_Paulo
    offices:
      - presidente
      - governador
      - senador
      - deputado_federal
      - deputado_estadual
      - deputado_distrital
    # Proveniência: título, data e URL conferidos em 2026-09-17 pelo scout, que
    # abriu a página da resolução via curl_cffi e transcreveu trechos verbatim
    # (relatório do scout de 2026-09-17, seção 1.3). `verified_at` registra essa
    # conferência.
    calendar_source:
      title: "Resolução TSE nº 23.760, de 2 de março de 2026 (Calendário Eleitoral)"
      url: https://www.tse.jus.br/legislacao/compilada/res/2026/resolucao-no-23-760-de-2-de-marco-de-2026
      verified_at: 2026-09-17
    notes:
      - "A votação é simultânea em todo o país e segue o horário de Brasília, inclusive nos estados com fuso horário diferente."
      - "Quem está fora do domicílio eleitoral pode justificar a ausência no dia da votação, das 8h às 17h (horário de Brasília)."
