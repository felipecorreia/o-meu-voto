[project]
name = "br-elections-mcp"
version = "0.1.0"
description = "MCP server and REST API over TSE open data: where to vote, candidates and election calendar for Brazilian elections, with no personal data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Felipe Correia" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "google-cloud-storage>=2.18",
    "mcp>=2.2.0,<3",
    "posthog>=7.58.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
    "uvicorn>=0.53.0",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Sociology",
]

[project.urls]
Repository = "https://github.com/felipecorreia/br-elections-mcp"
"Data source" = "https://dadosabertos.tse.jus.br"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "git-filter-repo>=2.47",
    "httpx>=0.28.1",
    "pytest>=8.3",
    "ruff>=0.8",
]
pipeline = [
    "boto3>=1.35",
    "curl-cffi>=0.10",
    "google-cloud-storage>=2.19",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/br_elections_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["br_elections_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
